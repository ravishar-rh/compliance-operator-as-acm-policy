---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-check-file-integrity-results
  namespace: compliance-operator-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SI System and Information Integrity
    policy.open-cluster-management.io/controls: SI-7 Software Firmware and Information Integrity
spec:
  disabled: false
  remediationAction: inform
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-configure-file-integrity
      namespace: compliance-operator-policies
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: check-worker-integrity-status
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: fileintegrity.openshift.io/v1alpha1
                kind: FileIntegrity
                metadata:
                  name: worker-fileintegrity
                  namespace: openshift-file-integrity
                status:
                  phase: Active
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: check-no-integrity-failures
        spec:
          remediationAction: inform
          severity: critical
          namespaceSelector:
            include:
              - openshift-file-integrity
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: fileintegrity.openshift.io/v1alpha1
                kind: FileIntegrityNodeStatus
                metadata:
                  namespace: openshift-file-integrity
                results:
                  - condition: Failed
