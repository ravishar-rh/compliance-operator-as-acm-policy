---
# Platform-level compliance scans (ocp4-cis / ocp4-moderate).
#
# Bound to placement-platform-profiles, which excludes HyperShift-hosted
# control planes. Those clusters publish only *-node Profiles, and a
# ScanSettingBinding that references any unresolvable profile produces a
# ComplianceSuite with an empty spec.scans -- which the API server rejects,
# leaving the operator in a permanent reconcile error loop and creating no
# scans at all, not even for the profiles that did resolve.
#
# Keeping platform profiles in their own bindings means a missing profile
# can never take the node scans down with it.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-platform-compliance-scans
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policy.open-cluster-management.io/standards: NIST SP 800-53, SOC 2
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-6 Configuration Settings
spec:
  disabled: false
  # Intentionally no root remediationAction -- each template sets its own.
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-cis-compliance-scan
      namespace: compliance-operator-policies
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-soc2-compliance-scan
      namespace: compliance-operator-policies
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cis-platform-scan-binding
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSettingBinding
                metadata:
                  name: cis-compliance-platform
                  namespace: openshift-compliance
                settingsRef:
                  name: cis-scan-setting
                  kind: ScanSetting
                  apiGroup: compliance.openshift.io/v1alpha1
                profiles:
                  - name: ocp4-cis
                    kind: Profile
                    apiGroup: compliance.openshift.io/v1alpha1
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: soc2-platform-scan-binding
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSettingBinding
                metadata:
                  name: soc2-compliance-platform
                  namespace: openshift-compliance
                settingsRef:
                  name: soc2-scan-setting
                  kind: ScanSetting
                  apiGroup: compliance.openshift.io/v1alpha1
                profiles:
                  - name: ocp4-moderate
                    kind: Profile
                    apiGroup: compliance.openshift.io/v1alpha1
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cis-platform-no-fail-results
        spec:
          remediationAction: inform
          severity: medium
          namespaceSelector:
            include:
              - openshift-compliance
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ComplianceCheckResult
                metadata:
                  namespace: openshift-compliance
                  labels:
                    compliance.openshift.io/check-status: FAIL
                    compliance.openshift.io/suite: cis-compliance-platform
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: soc2-platform-no-fail-results
        spec:
          remediationAction: inform
          severity: medium
          namespaceSelector:
            include:
              - openshift-compliance
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ComplianceCheckResult
                metadata:
                  namespace: openshift-compliance
                  labels:
                    compliance.openshift.io/check-status: FAIL
                    compliance.openshift.io/suite: soc2-compliance-platform
