---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: compliance-operator-policyset
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: >-
    Deploys the Compliance Operator and File Integrity Operator,
    configures CIS benchmark scans, configures audit log forwarding,
    and monitors runtime file integrity across all managed OpenShift clusters.
  policies:
    - policy-install-compliance-operator
    - policy-cis-compliance-scan
    - policy-check-compliance-results
    - policy-install-fio
    - policy-configure-file-integrity
    - policy-check-fio-results
    - policy-install-logging
    - policy-configure-log-forwarder
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-compliance-policyset
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
placementRef:
  name: placement-compliance-operator
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: compliance-operator-policyset
    apiGroup: policy.open-cluster-management.io
    kind: PolicySet
