---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-cis-compliance-scan
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-6 Configuration Settings
spec:
  disabled: false
  remediationAction: enforce
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-install-compliance-operator
      namespace: compliance-operator-policies
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cis-scan-setting
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSetting
                metadata:
                  name: cis-scan-setting
                  namespace: openshift-compliance
                roles:
                  - worker
                schedule: "0 1 * * *"
                rawResultStorage:
                  rotation: 3
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cis-scan-binding
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            # mustonlyhave, not musthave: musthave treats profiles as a
            # subset check and never prunes entries already on the object,
            # so dropping a profile here would not remove it from a
            # binding that already exists.
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSettingBinding
                metadata:
                  name: cis-compliance
                  namespace: openshift-compliance
                settingsRef:
                  name: cis-scan-setting
                  kind: ScanSetting
                  apiGroup: compliance.openshift.io/v1alpha1
                # Node profile only -- resolves on every cluster including
                # HyperShift/ROSA HCP. The platform profile (ocp4-cis) is
                # bound separately in 11-policy-platform-scans.yaml.
                profiles:
                  - name: ocp4-cis-node
                    kind: Profile
                    apiGroup: compliance.openshift.io/v1alpha1
