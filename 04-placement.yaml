---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-compliance-operator
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-platform-profiles
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
            # HyperShift-hosted control planes (ROSA HCP) do not publish
            # platform Profiles -- only *-node variants exist there. A
            # ScanSettingBinding fails entirely if any profile it lists is
            # unresolvable, so platform scans must skip those clusters.
            - key: cloud
              operator: NotIn
              values:
                - Amazon
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
