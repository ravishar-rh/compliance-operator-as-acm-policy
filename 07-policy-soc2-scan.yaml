---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-soc2-compliance-scan
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policy.open-cluster-management.io/standards: SOC 2
    policy.open-cluster-management.io/categories: "Security, Availability"
    policy.open-cluster-management.io/controls: >-
      CC6.1 Logical and Physical Access Controls,
      CC7.2 System Monitoring,
      CC8.1 Change Management
spec:
  disabled: false
  # No root-level remediationAction: a value here overrides every
  # policy-template below. The status/result checks must stay inform --
  # under enforce a mustnothave template deletes the ComplianceCheckResult
  # objects it matches, destroying scan history.
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-install-compliance-operator
      namespace: compliance-operator-policies
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: soc2-scan-setting
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSetting
                metadata:
                  name: soc2-scan-setting
                  namespace: openshift-compliance
                roles:
                  - worker
                schedule: "0 2 * * *"
                rawResultStorage:
                  pvAccessModes:
                    - ReadWriteOnce
                  rotation: 5
                  size: 2Gi
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: soc2-scan-binding
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            # See 02-policy-cis-scan.yaml -- musthave will not prune a
            # stale profile from an existing binding.
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ScanSettingBinding
                metadata:
                  name: soc2-compliance
                  namespace: openshift-compliance
                settingsRef:
                  name: soc2-scan-setting
                  kind: ScanSetting
                  apiGroup: compliance.openshift.io/v1alpha1
                # Node profile only -- see 02-policy-cis-scan.yaml. The
                # platform profile (ocp4-moderate) is bound separately in
                # 11-policy-platform-scans.yaml.
                profiles:
                  - name: ocp4-moderate-node
                    kind: Profile
                    apiGroup: compliance.openshift.io/v1alpha1
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: soc2-suite-status
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ComplianceSuite
                metadata:
                  name: soc2-compliance
                  namespace: openshift-compliance
                status:
                  phase: DONE
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: soc2-check-no-fail-results
        spec:
          remediationAction: inform
          severity: medium
          namespaceSelector:
            include:
              - openshift-compliance
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: compliance.openshift.io/v1alpha1
                kind: ComplianceCheckResult
                metadata:
                  namespace: openshift-compliance
                  labels:
                    compliance.openshift.io/check-status: FAIL
                    compliance.openshift.io/suite: soc2-compliance
