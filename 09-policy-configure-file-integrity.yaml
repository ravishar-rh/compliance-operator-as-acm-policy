---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-configure-file-integrity
  namespace: compliance-operator-policies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SI System and Information Integrity
    policy.open-cluster-management.io/controls: SI-7 Software Firmware and Information Integrity
spec:
  disabled: false
  remediationAction: enforce
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
      name: policy-install-fio
      namespace: compliance-operator-policies
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: fio-worker-fileintegrity
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: fileintegrity.openshift.io/v1alpha1
                kind: FileIntegrity
                metadata:
                  name: worker-fileintegrity
                  namespace: openshift-file-integrity
                spec:
                  nodeSelector:
                    node-role.kubernetes.io/worker: ""
                  # No config.name/config.namespace: use the AIDE config
                  # shipped with the operator. It already covers system
                  # binaries, /etc/kubernetes, SSH, the user/group databases,
                  # sudoers and systemd units, and -- critically -- excludes
                  # AIDE's own database and log plus the kubelet's churning
                  # state directories, which a hand-written config omits.
                  config:
                    gracePeriod: 900
                    maxBackups: 5
